name: smoke

# Live canary: a real MCP client handshake + the keyless live paths (public ATS
# JSON hiring signal + public DNS) on every push and daily. A true upstream
# reshape fails the gate and opens a maintenance issue — the self-maintenance
# signal, not a silent log. The full-site crawl runs advisory (a cloud-runner CDN
# block must not raise a false alarm).
on:
  push:
    branches: [master, main]
  schedule:
    - cron: '31 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: MCP client roundtrip + live gating paths
        id: test
        run: node test/smoke.mjs
      - name: Open maintenance issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'smoke: MCP enrichment canary failing';
            const body = [
              'The scheduled smoke canary failed — an MCP roundtrip assertion or a live gating path did not pass.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Likely a public ATS JSON shape drift (greenhouse canary) or a DNS/schema regression. Check src/adapters.js / src/verify.js. The full-site crawl is advisory and does not gate.',
            ].join('\n');
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'smoke',
            });
            if (existing.some((i) => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['smoke'],
            });
